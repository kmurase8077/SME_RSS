[Execution]
# Single SMILES for analysis (Leave blank for batch processing)
smiles = 

# Input file path for analyzing multiple molecules (TSV format: name\tSMILES)
# (If "smiles" is specified above, it takes precedence)
batch = input_test.smi

# Path to AiZynthFinder config.yml
config = config.yml

# Maximum number of attempts (number of mutants to generate)
samples = 100

# Maximum number of atom swaps per molecule
max_swaps = 10

# Number of parallel CPU jobs (If blank, automatically uses half of max cores. Each job consumes ~3 GB RAM)
jobs = 12

# Output file path for results (JSONL format)
out = mutants_results.jsonl

[Settings]
# Types of atoms to be used for mutation (comma-separated)
mutate_allowed = C, N, O, S, F, Cl, Br

# Probability weights for selecting each atom (Corresponds to the types above. comma-separated)
mutate_weights = 0.6, 0.2, 0.15, 0.02, 0.01, 0.01, 0.01

# Acceptable CN ratio range (Ratio of N to the sum of C and N)
min_n_ratio = 0.05
max_n_ratio = 0.40
 

[MaxCounts]
# Maximum count of each specific atom allowed in the generated mutant
S = 3
O = 15
F = 3
Cl = 3
Br = 3

[ProtectedSMARTS]
# SMARTS patterns for functional groups to protect from mutation
# Left side of "=" is a descriptive name, right side is the SMARTS pattern
carboxyl = [CX3](=O)[OX2H1,OX1-]        # -COOH
# ketone = [#6][CX3](=O)[#6]            # -C=O
# hydroxyl = [OX2H]                     # -OH
# primary_amine = [NX3;H2;!$(NC=O)]     # -NH2
# secondary_amine = [NX3;H1;!$(NC=O)]   # -NHR
# tertiary_amine = [NX3;H0;!$(NC=O)]    # -NR2
# ester = [#6][CX3](=O)[OX2H0][#6]      # -COOR
# ether = [OD2]([#6])[#6]               # -OR
